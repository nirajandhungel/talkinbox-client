# ─────────────────────────────────────────────────────────────────────────────
#  nginx.spa.conf — Nginx config for serving the Vite SPA
#  This runs INSIDE the frontend container (not the reverse-proxy nginx).
#  It serves all routes → index.html (required for React Router).
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long-lived cache
    location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|svg|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
